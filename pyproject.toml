[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idea-graph"
version = "0.3.0"
description = "Граф идеи: от сферы бизнеса к проблемам для автоматизации и решению — ядро, движок и оболочка одной командой"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "idea-graph-core @ git+https://github.com/senia-glitch/idea-graph-core.git",
    "idea-graph-engine @ git+https://github.com/senia-glitch/idea-graph-composer.git",
    "idea-graph-shell @ git+https://github.com/senia-glitch/idea-graph-shell.git",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
