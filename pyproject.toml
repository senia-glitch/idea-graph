[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idea-graph"
version = "0.1.0"
description = "Граф идеи: готовое решение из коробки — ставит ядро, оболочку и этап «Проблема» одной командой"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "idea-graph-core @ git+https://github.com/senia-glitch/idea-graph-core.git",
    "idea-graph-shell @ git+https://github.com/senia-glitch/idea-graph-shell.git",
    "idea-graph-problem @ git+https://github.com/senia-glitch/idea-graph-problem.git",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
